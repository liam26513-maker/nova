# Regole di base di detekt, con eccezioni motivate.
naming:
  FunctionNaming:
    # I composable Compose iniziano con la maiuscola.
    ignoreAnnotated: ['Composable']
style:
  MaxLineLength:
    maxLineLength: 140 # allineato a ktlint (.editorconfig)
  MagicNumber:
    # Token di design, coefficienti geometrici e sfondo dimostrativo sono numeri voluti.
    excludes: ['**/core/design/**', '**/DesignShowcase.kt']
  ReturnCount:
    max: 4
complexity:
  LongParameterList:
    functionThreshold: 7
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInClasses: 15
