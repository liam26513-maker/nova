name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Validazione config/ contro gli schemi
        run: |
          pip install --quiet jsonschema
          python tools/validate_config.py config

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint di stile (ktlint, detekt)
        run: ./gradlew ktlintCheck detekt

      - name: Test unitari
        run: ./gradlew test

      - name: Android Lint e build release
        run: ./gradlew :app:lintRelease :app:assembleRelease

      - name: Budget di dimensione (perf-budget.json)
        run: python tools/check_budget.py app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Script di rilascio
        run: python tools/next_version.py

      - name: Report dei test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-test
          path: '**/build/reports/'
