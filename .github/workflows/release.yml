name: Rilascio

# Ogni modifica del codice unita a main diventa una release firmata che il tablet installa da solo
# (SPEC §4.5). Le modifiche alla sola configurazione o alla documentazione non creano un APK.
on:
  push:
    branches: [main]
    paths-ignore: ['config/**', 'docs/**', 'reports/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

env:
  NOVA_CERT_SHA256: bc629beba848496d5c9317c33a14df01e3203f612a78a4a23aac61fbcaa6c3eb

concurrency:
  group: rilascio
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Versione
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh release list --limit 200 --json tagName --jq '.[].tagName')
          read code name standby < <(python tools/next_version.py $tags)
          # Versione dell'app precedente: il suo codice viene preparato come ritorno immediato.
          previous=$(printf '%s\n' $tags | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k3 -n | tail -1 || true)
          echo "NOVA_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "NOVA_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "NOVA_STANDBY_CODE=$standby" >> "$GITHUB_ENV"
          echo "NOVA_PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"
          echo "Versione $name ($code), ripristino di ${previous:-nessuna} come $standby"

      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Manca il segreto NOVA_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nova.jks"
          echo "NOVA_KEYSTORE_FILE=$RUNNER_TEMP/nova.jks" >> "$GITHUB_ENV"

      - name: Test e build firmata
        env:
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: ./gradlew test :app:assembleRelease

      - name: Verifica firma e budget
        run: |
          mkdir -p out
          apk=out/nova-$NOVA_VERSION_CODE.apk
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          tools/verify_apk.sh "$apk"
          python tools/check_budget.py "$apk"

      # Ritorno immediato (SPEC §4.6): lo stesso codice della versione precedente, con un numero più
      # alto, allegato a questa release. Se non si riesce a preparare, la release esce lo stesso.
      - name: Ripristino immediato della versione precedente
        if: env.NOVA_PREVIOUS_TAG != ''
        continue-on-error: true
        env:
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          git fetch --depth=1 origin "refs/tags/$NOVA_PREVIOUS_TAG:refs/tags/$NOVA_PREVIOUS_TAG"
          git worktree add "$RUNNER_TEMP/precedente" "$NOVA_PREVIOUS_TAG"
          cd "$RUNNER_TEMP/precedente"
          chmod +x gradlew
          NOVA_VERSION_CODE=$NOVA_STANDBY_CODE NOVA_VERSION_NAME="0.1.$NOVA_STANDBY_CODE" ./gradlew :app:assembleRelease
          cd "$GITHUB_WORKSPACE"
          standby="out/nova-ripristino-$NOVA_STANDBY_CODE-$NOVA_PREVIOUS_TAG.apk"
          cp "$RUNNER_TEMP/precedente/app/build/outputs/apk/release/app-release.apk" "$standby"
          tools/verify_apk.sh "$standby" || { rm -f "$standby"; exit 1; }
          (cd out && sha256sum "$(basename "$standby")" > "$(basename "$standby").sha256")

      - name: Pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && sha256sum "nova-$NOVA_VERSION_CODE.apk" > "nova-$NOVA_VERSION_CODE.apk.sha256")
          python tools/release_notes.py CHANGELOG.md > out/note.md
          gh release create "v$NOVA_VERSION_NAME" out/nova-*.apk out/nova-*.apk.sha256 \
            --title "NOVA $NOVA_VERSION_NAME" --notes-file out/note.md --target "$GITHUB_SHA"

      - name: Pulizia
        if: always()
        run: rm -rf "$RUNNER_TEMP/nova.jks" "$RUNNER_TEMP/precedente"
