name: Rilascio

# Ogni modifica del codice unita a main diventa una release firmata che il tablet installa da solo
# (SPEC §4.5). Le modifiche alla sola configurazione o alla documentazione non creano un APK.
on:
  push:
    branches: [main]
    paths-ignore: ['config/**', 'docs/**', 'reports/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rilascio
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Versione
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh release list --limit 200 --json tagName --jq '.[].tagName')
          read code name < <(python tools/next_version.py $tags)
          echo "NOVA_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "NOVA_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "Versione $name ($code)"

      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Manca il segreto NOVA_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nova.jks"
          echo "NOVA_KEYSTORE_FILE=$RUNNER_TEMP/nova.jks" >> "$GITHUB_ENV"

      - name: Test e build firmata
        env:
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: ./gradlew test :app:assembleRelease

      - name: Verifica firma e budget
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk" | grep -i "SHA-256"
          python tools/check_budget.py "$apk"

      - name: Pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/nova-$NOVA_VERSION_CODE.apk"
          (cd out && sha256sum "nova-$NOVA_VERSION_CODE.apk" > "nova-$NOVA_VERSION_CODE.apk.sha256")
          python tools/release_notes.py CHANGELOG.md > out/note.md
          gh release create "v$NOVA_VERSION_NAME" out/nova-*.apk out/nova-*.apk.sha256 \
            --title "NOVA $NOVA_VERSION_NAME" --notes-file out/note.md --target "$GITHUB_SHA"

      - name: Pulizia
        if: always()
        run: rm -f "$RUNNER_TEMP/nova.jks"
