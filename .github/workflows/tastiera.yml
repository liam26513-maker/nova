name: Tastiera

# La tastiera di NOVA (fork di HeliBoard, GPL-3.0) è un progetto Gradle separato in keyboard/: usa strumenti più nuovi
# del resto (Android Gradle Plugin 9, Gradle 9, codice nativo), quindi ha il suo controllo. Parte solo se cambia lei.
on:
  pull_request:
    paths: ['keyboard/**', 'tools/check_keyboard.py', 'tools/test_check_keyboard.py', 'perf-budget.json', '.github/workflows/tastiera.yml']
  push:
    branches: [main]
    paths: ['keyboard/**', 'tools/check_keyboard.py', 'tools/test_check_keyboard.py', 'perf-budget.json', '.github/workflows/tastiera.yml']
  workflow_dispatch:

concurrency:
  group: tastiera-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: keyboard

      - name: Prove degli strumenti di controllo
        run: python -m unittest tools/test_check_keyboard.py

      - name: Prove della tastiera (numerazione di versione)
        working-directory: keyboard
        run: |
          chmod +x gradlew
          # Elenco dei compiti di prova disponibili (utile se il nome cambia con la versione degli strumenti).
          ./gradlew :app:tasks --all --console=plain | grep -E "^test[A-Za-z]*UnitTest " || true
          ./gradlew :app:testDebugUnitTest --tests 'helium314.keyboard.latin.NovaUpgradeTest' --stacktrace

      - name: Build release (senza firma)
        working-directory: keyboard
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Nessun permesso Internet, pacchetto e budget di peso
        run: |
          apk=$(ls keyboard/app/build/outputs/apk/release/*.apk | head -1)
          python tools/check_keyboard.py keyboard/app/build "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tastiera-apk
          path: keyboard/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-tastiera
          path: keyboard/app/build/reports/
